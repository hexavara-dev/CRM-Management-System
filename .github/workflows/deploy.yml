name: Deploy to VPS

on:
  # Deploy hanya dijalankan manual. Panduan: docs/CI_CD.md
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: "Skip tests (use for hotfixes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    name: Run CI
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    # Secrets dan variables diambil dari GitHub Environment yang dipilih.
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://${{ vars.APP_DOMAIN }}

    env:
      APP_NAME: ${{ vars.APP_NAME }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Validate configuration
        run: |
          for name in APP_NAME APP_DOMAIN VPS_USER VPS_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::$name belum diatur di GitHub Environment"
              exit 1
            fi
          done
          # APP_NAME dipakai sebagai nama folder dan nama project Docker Compose.
          if ! [[ "$APP_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::APP_NAME hanya boleh huruf kecil, angka, dan tanda hubung"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release archive
        run: git archive --format=tar.gz -o release.tar.gz HEAD

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload release to server
        run: scp -i ~/.ssh/deploy_key release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/$APP_NAME-release.tar.gz"

      # Image di-build di server, dan migrasi dijalankan backend saat start.
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "APP_NAME='$APP_NAME' bash -s" << 'ENDSSH'
          set -euo pipefail

          APP_DIR="/var/www/$APP_NAME"
          RELEASE_DIR="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"

          if [ ! -f "$APP_DIR/.env" ]; then
            echo "Missing $APP_DIR/.env" >&2
            exit 1
          fi

          echo "Extracting release..."
          mkdir -p "$RELEASE_DIR"
          tar -xzf "/tmp/$APP_NAME-release.tar.gz" -C "$RELEASE_DIR"
          rm "/tmp/$APP_NAME-release.tar.gz"
          cd "$RELEASE_DIR"

          # Nama project tetap, sehingga volume database dan upload dipakai lintas release.
          compose() {
            docker compose -p "$APP_NAME" --env-file "$APP_DIR/.env" "$@"
          }

          echo "Building and starting containers..."
          compose up --build -d --remove-orphans
          ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

          echo "Checking API health..."
          healthy=false
          for attempt in $(seq 1 30); do
            if compose exec -T backend wget -qO- http://127.0.0.1:3000/health > /dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 3
          done
          if [ "$healthy" != "true" ]; then
            echo "API health check failed" >&2
            compose logs --tail=30 backend >&2 || true
            exit 1
          fi

          echo "Cleaning old releases and images (keeping last 5 releases)..."
          cd "$APP_DIR/releases"
          ls -1t | tail -n +6 | xargs -r rm -rf
          docker image prune -f > /dev/null

          echo "Deployment complete!"
          ENDSSH

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "   Environment: ${{ github.event.inputs.environment }}"
          echo "   App: $APP_NAME"
          echo "   Branch: ${{ github.ref_name }}"
          echo "   URL: https://$APP_DOMAIN"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "   Environment: ${{ github.event.inputs.environment }}"
          echo "   App: $APP_NAME"
          echo "   Branch: ${{ github.ref_name }}"
