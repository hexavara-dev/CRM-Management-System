services:
  db:
    image: mysql:8.0
    container_name: crm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD di file .env root}
      MYSQL_DATABASE: crm_engine
    ports:
      # Hanya bisa diakses dari mesin ini. Default 3307 agar tidak bentrok dengan MySQL lokal.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:?Set DB_PASSWORD di file .env root}@db:3306/crm_engine
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET di file .env root}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS di file .env root}
      DEV_BASE_URL: ${API_URL:?Set API_URL di file .env root}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL_DEV: ${API_URL:?Set API_URL di file .env root}
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
